name: Radar regressions
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Version pineada: una version nueva de ruff puede sumar reglas y poner el
      # CI en rojo sin que cambiara el codigo. Se sube a mano cuando toca.
      - run: python -m pip install ruff==0.16.8
      - run: ruff check motoradar tests
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q motoradar tests
